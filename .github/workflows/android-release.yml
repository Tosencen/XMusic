name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          fail() { echo "::error::$1"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "::notice::SDK_ROOT=$SDK_ROOT"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ]; then
            echo "::notice::android-37.0 已存在，跳过安装"
            exit 0
          fi
          [ -d "$SDK_ROOT" ] || fail "SDK 目录不存在：$SDK_ROOT"
          # 预写 license（android-sdk-license 官方固定哈希），供 AGP 校验
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          # 1) 优先用镜像自带 sdkmanager（显式 --sdk_root）
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "::notice::尝试 sdkmanager=$SDKMANAGER"
            if OUT=$("$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" 2>&1); then
              echo "::notice::sdkmanager 安装成功"
              exit 0
            fi
            echo "::notice::sdkmanager 失败，转 curl 手动安装：$(echo "$OUT" | tail -5 | tr '\n' ' ' | cut -c1-300)"
          else
            echo "::notice::未找到 sdkmanager，转 curl 手动安装"
          fi
          # 2) curl 直取仓库 XML → 下载 platform zip → 手动放置
          REACH=0
          for f in repository2-3.xml repository2-1.xml; do
            if curl -fsSL --max-time 20 -o /tmp/repo.xml "https://dl.google.com/android/repository/$f"; then
              REACH=1
              grep -q "platform-37" /tmp/repo.xml && break
            fi
          done
          [ "$REACH" = "1" ] || fail "dl.google.com 仓库 XML 不可达"
          ZIP=$(grep -o 'platform-37\.0_r[0-9]*\.zip' /tmp/repo.xml | head -1 || true)
          [ -n "$ZIP" ] || fail "仓库 XML 中未找到 platform-37.0 zip（$(wc -c < /tmp/repo.xml) bytes）"
          echo "::notice::下载 $ZIP"
          curl -fsSL --max-time 120 -o /tmp/p.zip "https://dl.google.com/android/repository/$ZIP" \
            || fail "下载 $ZIP 失败"
          rm -rf /tmp/pf && mkdir -p /tmp/pf
          unzip -q /tmp/p.zip -d /tmp/pf || fail "解压 $ZIP 失败"
          mkdir -p "$SDK_ROOT/platforms/android-37.0"
          if [ -f /tmp/pf/package.xml ]; then
            cp -r /tmp/pf/. "$SDK_ROOT/platforms/android-37.0/"
          else
            INNER=$(ls -1 /tmp/pf 2>/dev/null | head -1 || true)
            [ -n "$INNER" ] || fail "zip 结构未知"
            cp -r "/tmp/pf/$INNER/." "$SDK_ROOT/platforms/android-37.0/"
          fi
          [ -f "$SDK_ROOT/platforms/android-37.0/package.xml" ] || fail "校验失败：缺 package.xml"
          [ -f "$SDK_ROOT/platforms/android-37.0/android.jar" ] || fail "校验失败：缺 android.jar"
          echo "::notice::android-37.0 手动安装成功"

      - name: Probe repository reachability
        run: |
          for u in \
            "https://repo.maven.apache.org/maven2/" \
            "https://plugins.gradle.org/m2/" \
            "https://maven.aliyun.com/repository/public/" \
            "https://maven.aliyun.com/repository/google/" \
            "https://dl.google.com/dl/android/maven2/"; do
            code=$(curl -s -m 12 -o /dev/null -w "%{http_code}" "$u" || echo "000")
            echo "::notice::probe $u -> $code"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret KEYSTORE_BASE64（仓库 Settings → Secrets and variables → Actions）。拒绝出包：否则 release 会退回随机 debug 签名，各版本签名互不一致、应用内更新装不上。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/xmusic-release.keystore"
          [ -s "$GITHUB_WORKSPACE/xmusic-release.keystore" ] || { echo "::error::keystore base64 解码为空"; exit 1; }
          echo "::notice::keystore 已就绪"

      - name: Build release APK
        env:
          KEYSTORE_FILE: xmusic-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # PKCS12 不支持独立 key 口令（key 即以 store 口令保护），两者必须同值
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if ! ./gradlew assembleRelease --stacktrace > build.log 2>&1; then
            BLOCK=$(awk '/What went wrong/,/Get more help/' build.log | head -80)
            ENC=$(printf '%s' "$BLOCK" | sed -e 's/$/%0A/' | tr -d '\n')
            echo "::error::$ENC"
            grep -E "Could not GET|Could not HEAD|Could not resolve|status code|timed out|Connection|OutOfMemory|^e: " build.log \
              | tail -25 | sed 's/^/::error::/' || true
            echo "=== build.log 尾部 ==="
            tail -n 60 build.log
            exit 1
          fi

      - name: Verify APK signature
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          CERT=$("${BT}apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1) \
            || { echo "::error::apksigner 校验失败：$CERT"; exit 1; }
          SHA=$(echo "$CERT" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "::notice::APK 签名 SHA-256=$SHA"
          echo "$CERT" | grep 'Signer:' | head -4

      - name: Push failure log to ci-logs branch
        if: failure()
        run: |
          git config user.name "ci-logs"
          git config user.email "ci-logs@users.noreply.github.com"
          git checkout -B ci-logs
          if [ -f build.log ]; then
            tail -n 500 build.log > "failure-${GITHUB_SHA:0:7}.log"
          else
            echo "build.log 不存在（失败于更早步骤）" > "failure-${GITHUB_SHA:0:7}.log"
          fi
          git add -f "failure-${GITHUB_SHA:0:7}.log"
          git add -f build.log 2>/dev/null || true
          git commit -m "ci: failure log ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin ci-logs

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/XMusic-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMusic-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
