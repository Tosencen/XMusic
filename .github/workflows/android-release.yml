name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          fail() { echo "::error::$1"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "::notice::SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::notice::SDK 目录不存在，交由 AGP 处理"
            exit 0
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f -print -quit 2>/dev/null || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::notice::未找到 sdkmanager，下载 commandlinetools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              || fail "下载 cmdline-tools 失败"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/clt.zip -d "$SDK_ROOT/cmdline-tools" || fail "解压 cmdline-tools 失败"
            if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
              mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            fi
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)
            [ -n "$SDKMANAGER" ] || fail "cmdline-tools 安装后仍未找到 sdkmanager"
          fi
          echo "::notice::sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          OUT=$("$SDKMANAGER" "platforms;android-37" 2>&1) || fail "sdkmanager 安装 android-37 失败：$(echo "$OUT" | tail -3 | tr '\n' ' ')"
          echo "::notice::android-37 安装成功"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          if ! ./gradlew assembleRelease --stacktrace > build.log 2>&1; then
            grep -E "^e: |FAILURE:|error:|Execution failed|Caused by:|What went wrong" build.log | tail -20 | sed 's/^/::error::/' || true
            echo "=== build.log 尾部 ==="
            tail -n 60 build.log
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/XMusic-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMusic-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
