name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "### SDK 环境"
            echo "- ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "- ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            echo "- 解析 SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "SDK 目录不存在，交由 AGP 处理" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f -print -quit 2>/dev/null)
          fi
          echo "sdkmanager=$SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "未找到 sdkmanager，交由 AGP 自动下载" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if ! OUT=$("$SDKMANAGER" "platforms;android-37" 2>&1); then
            {
              echo "### sdkmanager 安装 android-37 失败"
              echo '```'
              echo "$OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "android-37 安装成功" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          if ! ./gradlew assembleRelease --stacktrace > build.log 2>&1; then
            {
              echo "### Release 构建失败日志尾部"
              echo '```'
              tail -n 120 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 build.log
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/XMusic-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMusic-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
